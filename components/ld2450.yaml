# HLK-LD2450 mmWave radar: presence, movement, target tracking and zones

substitutions:
  # Zone presets (mm). X is sideways (radar coordinates), Y is the distance from the radar.
  ld2450_preset_width: "4000"   # Half width of the covered area
  ld2450_preset_depth: "6000"   # Maximum distance
  ld2450_radar_data_interval: "500ms"  # How often "Radar Data" (radar map on the web page) is refreshed

# UART configuration for sensor communication
uart:
  id: uart_ld2450
  tx_pin: GPIO20
  rx_pin: GPIO21
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

# Numbers to configure zones and presence timeout from Home Assistant
number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Presence timeout"
    zone_1:
      x1:
        name: "Zone 1 X1"
        id: ld2450_zone1_x1
      x2:
        name: "Zone 1 X2"
        id: ld2450_zone1_x2
      y1:
        name: "Zone 1 Y1"
        id: ld2450_zone1_y1
      y2:
        name: "Zone 1 Y2"
        id: ld2450_zone1_y2
    zone_2:
      x1:
        name: "Zone 2 X1"
        id: ld2450_zone2_x1
      x2:
        name: "Zone 2 X2"
        id: ld2450_zone2_x2
      y1:
        name: "Zone 2 Y1"
        id: ld2450_zone2_y1
      y2:
        name: "Zone 2 Y2"
        id: ld2450_zone2_y2
    zone_3:
      x1:
        name: "Zone 3 X1"
        id: ld2450_zone3_x1
      x2:
        name: "Zone 3 X2"
        id: ld2450_zone3_x2
      y1:
        name: "Zone 3 Y1"
        id: ld2450_zone3_y1
      y2:
        name: "Zone 3 Y2"
        id: ld2450_zone3_y2

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Presence"
      id: ld2450_presence  # Used by led-air-quality.yaml (night mode)
    has_moving_target:
      name: "Movement"
    has_still_target:
      name: "Stationary"

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    bluetooth:
      name: "LD2450 Bluetooth"
      restore_mode: ALWAYS_OFF
      disabled_by_default: true
    multi_target:
      name: "Multi Target Tracking"

select:
  - platform: ld2450
    ld2450_id: ld2450_radar
    zone_type:
      name: "Zone Type"
      id: ld2450_zone_type

  # Fills in all zone coordinates at once (the zone numbers are updated by the radar)
  - platform: template
    name: "Zone Preset"
    id: ld2450_zone_preset
    icon: "mdi:floor-plan"
    entity_category: config
    optimistic: true
    options:
      - "Custom"
      - "Whole Room"
      - "2 Zones Side by Side"
      - "3 Zones Side by Side"
      - "3 Zones by Distance"
    initial_option: "Custom"
    set_action:
      - lambda: |-
          const int w = ${ld2450_preset_width};
          const int d = ${ld2450_preset_depth};
          const int ZONE_DETECTION = 1;
          // Zones: x1, y1, x2, y2; all zeros = unused. Side by side: zone 1 = negative X.
          // Generic presets for any room; fine-tune the zone numbers afterwards if needed.
          if (x == "Whole Room") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, w, d, 0, 0, 0, 0, 0, 0, 0, 0);
          } else if (x == "2 Zones Side by Side") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, 0, d, 0, 0, w, d, 0, 0, 0, 0);
          } else if (x == "3 Zones Side by Side") {
            const int c = w / 4;  // Middle zone: 1 m on each side of the centre line by default
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, -c, d, -c, 0, c, d, c, 0, w, d);
          } else if (x == "3 Zones by Distance") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, w, d / 4, -w, d / 4, w, d / 2, -w, d / 2, w, d);
          } else {
            return;  // Custom: keep the current zone numbers
          }
          ESP_LOGI("ld2450", "Zone preset applied: %s", x.c_str());

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "LD2450 Firmware"
      disabled_by_default: true
    mac_address:
      name: "LD2450 BT MAC"
      disabled_by_default: true
    target_1:
      direction:
        name: "Target Direction"

  # All targets and zones as one small JSON text, read by the radar map on the device's web page
  # (components/web/sensorcube.js) and the Home Assistant dashboard card (dist/sensorcube-radar-card.js).
  # Only published when something changed.
  # Example: {"t":[[-520,1830],null,null],"z":[[-4000,0,0,6000],[0,0,4000,6000],[0,0,0,0]],"zt":"Detection"}
  - platform: template
    name: "Radar Data"
    id: ld2450_radar_data
    icon: "mdi:radar"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: ${ld2450_radar_data_interval}
    lambda: |-
      static std::string last;
      auto v = [](sensor::Sensor *s) -> int { return isnan(s->state) ? 0 : (int) s->state; };
      auto n = [](number::Number *s) -> int { return (s->has_state() && !isnan(s->state)) ? (int) s->state : 0; };
      sensor::Sensor *xs[3] = {id(ld2450_target1_x), id(ld2450_target2_x), id(ld2450_target3_x)};
      sensor::Sensor *ys[3] = {id(ld2450_target1_y), id(ld2450_target2_y), id(ld2450_target3_y)};
      number::Number *zs[3][4] = {
          {id(ld2450_zone1_x1), id(ld2450_zone1_y1), id(ld2450_zone1_x2), id(ld2450_zone1_y2)},
          {id(ld2450_zone2_x1), id(ld2450_zone2_y1), id(ld2450_zone2_x2), id(ld2450_zone2_y2)},
          {id(ld2450_zone3_x1), id(ld2450_zone3_y1), id(ld2450_zone3_x2), id(ld2450_zone3_y2)}};
      char buf[256];
      int len = snprintf(buf, sizeof(buf), "{\"t\":[");
      for (int i = 0; i < 3; i++) {
        bool present = !isnan(xs[i]->state) && !isnan(ys[i]->state);
        len += present ? snprintf(buf + len, sizeof(buf) - len, "%s[%d,%d]", i ? "," : "", v(xs[i]), v(ys[i]))
                       : snprintf(buf + len, sizeof(buf) - len, "%snull", i ? "," : "");
      }
      len += snprintf(buf + len, sizeof(buf) - len, "],\"z\":[");
      for (int i = 0; i < 3; i++) {
        len += snprintf(buf + len, sizeof(buf) - len, "%s[%d,%d,%d,%d]", i ? "," : "", n(zs[i][0]), n(zs[i][1]),
                        n(zs[i][2]), n(zs[i][3]));
      }
      auto zone_type = id(ld2450_zone_type).current_option();
      snprintf(buf + len, sizeof(buf) - len, "],\"zt\":\"%s\"}", zone_type.empty() ? "" : zone_type.c_str());
      if (last == buf) return {};
      last = buf;
      return last;

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Target count"
    still_target_count:
      name: "Still Target Count"
    moving_target_count:
      name: "Moving Target Count"
    target_1:
      x:
        name: "Target X"
        id: ld2450_target1_x
      y:
        name: "Target Y"
        id: ld2450_target1_y
      speed:
        name: "Target Speed"
      angle:
        name: "Target Angle"
        id: ld2450_target1_angle  # Used by the "Presence Tracker" LED effect
      distance:
        name: "Target Distance"
      resolution:
        name: "Target Resolution"
    # 2nd/3rd person: angles for the "Presence Tracker" LED effect, X/Y for "Radar Data"
    target_2:
      x:
        id: ld2450_target2_x
        internal: true
      y:
        id: ld2450_target2_y
        internal: true
      angle:
        name: "Target 2 Angle"
        id: ld2450_target2_angle
        internal: true
    target_3:
      x:
        id: ld2450_target3_x
        internal: true
      y:
        id: ld2450_target3_y
        internal: true
      angle:
        name: "Target 3 Angle"
        id: ld2450_target3_angle
        internal: true
    zone_1:
      target_count:
        name: "Zone 1 Count"
      still_target_count:
        name: "Zone 1 Still Target Count"
      moving_target_count:
        name: "Zone 1 Moving Target Count"
    zone_2:
      target_count:
        name: "Zone 2 Count"
      still_target_count:
        name: "Zone 2 Still Target Count"
      moving_target_count:
        name: "Zone 2 Moving Target Count"
    zone_3:
      target_count:
        name: "Zone 3 Count"
      still_target_count:
        name: "Zone 3 Still Target Count"
      moving_target_count:
        name: "Zone 3 Moving Target Count"
