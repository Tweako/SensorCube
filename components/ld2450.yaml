# HLK-LD2450 mmWave radar: presence, movement, target tracking and zones

substitutions:
  # Zone presets (mm). X is sideways (radar coordinates), Y is the distance from the radar.
  ld2450_preset_width: "4000"   # Half width of the covered area
  ld2450_preset_depth: "6000"   # Maximum distance

# UART configuration for sensor communication
uart:
  id: uart_ld2450
  tx_pin: GPIO20
  rx_pin: GPIO21
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

ld2450:
  id: ld2450_radar
  uart_id: uart_ld2450

# Numbers to configure zones and presence timeout from Home Assistant
number:
  - platform: ld2450
    ld2450_id: ld2450_radar
    presence_timeout:
      name: "Presence timeout"
    zone_1:
      x1:
        name: "Zone 1 X1"
      x2:
        name: "Zone 1 X2"
      y1:
        name: "Zone 1 Y1"
      y2:
        name: "Zone 1 Y2"
    zone_2:
      x1:
        name: "Zone 2 X1"
      x2:
        name: "Zone 2 X2"
      y1:
        name: "Zone 2 Y1"
      y2:
        name: "Zone 2 Y2"
    zone_3:
      x1:
        name: "Zone 3 X1"
      x2:
        name: "Zone 3 X2"
      y1:
        name: "Zone 3 Y1"
      y2:
        name: "Zone 3 Y2"

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    has_target:
      name: "Presence"
      id: ld2450_presence  # Used by led-air-quality.yaml (night mode)
    has_moving_target:
      name: "Movement"
    has_still_target:
      name: "Stationary"

switch:
  - platform: ld2450
    ld2450_id: ld2450_radar
    bluetooth:
      name: "LD2450 Bluetooth"
      restore_mode: ALWAYS_OFF
      disabled_by_default: true
    multi_target:
      name: "Multi Target Tracking"

select:
  - platform: ld2450
    ld2450_id: ld2450_radar
    zone_type:
      name: "Zone Type"

  # Fills in all zone coordinates at once (the zone numbers are updated by the radar)
  - platform: template
    name: "Zone Preset"
    id: ld2450_zone_preset
    icon: "mdi:floor-plan"
    entity_category: config
    optimistic: true
    options:
      - "Custom"
      - "Whole Room"
      - "2 Zones Side by Side"
      - "3 Zones Side by Side"
      - "3 Zones by Distance"
    initial_option: "Custom"
    set_action:
      - lambda: |-
          const int w = ${ld2450_preset_width};
          const int d = ${ld2450_preset_depth};
          const int ZONE_DETECTION = 1;
          // Zones: x1, y1, x2, y2; all zeros = unused. Side by side: zone 1 = negative X.
          // Generic presets for any room; fine-tune the zone numbers afterwards if needed.
          if (x == "Whole Room") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, w, d, 0, 0, 0, 0, 0, 0, 0, 0);
          } else if (x == "2 Zones Side by Side") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, 0, d, 0, 0, w, d, 0, 0, 0, 0);
          } else if (x == "3 Zones Side by Side") {
            const int c = w / 4;  // Middle zone: 1 m on each side of the centre line by default
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, -c, d, -c, 0, c, d, c, 0, w, d);
          } else if (x == "3 Zones by Distance") {
            id(ld2450_radar)->set_radar_zone(ZONE_DETECTION, -w, 0, w, d / 4, -w, d / 4, w, d / 2, -w, d / 2, w, d);
          } else {
            return;  // Custom: keep the current zone numbers
          }
          ESP_LOGI("ld2450", "Zone preset applied: %s", x.c_str());

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    version:
      name: "LD2450 Firmware"
      disabled_by_default: true
    mac_address:
      name: "LD2450 BT MAC"
      disabled_by_default: true
    target_1:
      direction:
        name: "Target Direction"

sensor:
  - platform: ld2450
    ld2450_id: ld2450_radar
    target_count:
      name: "Target count"
    still_target_count:
      name: "Still Target Count"
    moving_target_count:
      name: "Moving Target Count"
    target_1:
      x:
        name: "Target X"
      y:
        name: "Target Y"
      speed:
        name: "Target Speed"
      angle:
        name: "Target Angle"
        id: ld2450_target1_angle  # Used by the "Presence Tracker" LED effect
      distance:
        name: "Target Distance"
      resolution:
        name: "Target Resolution"
    # Angles of the 2nd/3rd person, only for the "Presence Tracker" LED effect
    target_2:
      angle:
        name: "Target 2 Angle"
        id: ld2450_target2_angle
        internal: true
    target_3:
      angle:
        name: "Target 3 Angle"
        id: ld2450_target3_angle
        internal: true
    zone_1:
      target_count:
        name: "Zone 1 Count"
      still_target_count:
        name: "Zone 1 Still Target Count"
      moving_target_count:
        name: "Zone 1 Moving Target Count"
    zone_2:
      target_count:
        name: "Zone 2 Count"
      still_target_count:
        name: "Zone 2 Still Target Count"
      moving_target_count:
        name: "Zone 2 Moving Target Count"
    zone_3:
      target_count:
        name: "Zone 3 Count"
      still_target_count:
        name: "Zone 3 Still Target Count"
      moving_target_count:
        name: "Zone 3 Moving Target Count"
