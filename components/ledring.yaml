# LED ring (WS2812) with effects, and a boot animation
# The "Presence Tracker" effect needs the LD2450 target angles (ld2450.yaml).

substitutions:
  # LED that points straight ahead (the radar's direction). The ring starts and ends
  # at the back of the cube, so the front is in the middle of the strip.
  ledring_front_led: "6"
  ledring_direction: "1"      # 1 or -1: which way the LED index runs around the cube

esphome:
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: led_ring
          red: 0.0
          green: 0.0
          blue: 1.0
          effect: "Scan"

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    chipset: WS2812
    gamma_correct: 1.5
    pin: GPIO4
    num_leds: ${num_leds}
    name: "LED ring"
    id: led_ring
    effects:
      - addressable_rainbow:
          name: "Rainbow Spinner"
          speed: 8
          width: "${num_leds}"
      - addressable_rainbow:
          name: "Rainbow Fader"
          speed: 3
          width: "${num_leds}"
      - random:
          name: "Random Slow"
          transition_length: 30s
          update_interval: 30s
      - addressable_lambda:
          name: "Fire"
          update_interval: 15ms
          lambda: |-
            int Cooling = 55;
            int Sparking = 110;
            static uint8_t heat[188];
            int cooldown;

            // Step 1.  Cool down every cell a little
            for( int i = 0; i < it.size(); i++) {
              cooldown = rand() % (((Cooling * 10) / it.size()) + 2);

              if(cooldown>heat[i]) {
                heat[i]=0;
              } else {
                heat[i]=heat[i]-cooldown;
              }
            }

            // Step 2.  Heat from each cell drifts 'up' and diffuses a little
            for( int k= it.size() - 1; k >= 2; k--) {
              heat[k] = (heat[k - 1] + heat[k - 2] + heat[k - 2]) / 3;
            }

            // Step 3.  Randomly ignite new 'sparks' near the bottom
            if( (rand() % 255) < Sparking ) {
              int y = rand() % 7;
              heat[y] = heat[y] + (rand() % 95) + 160;
            }

            // Step 4.  Convert heat to LED colors
            for( int Pixel = 0; Pixel < it.size(); Pixel++) {
              // Scale 'heat' down from 0-255 to 0-191
              uint8_t t192 = round((heat[Pixel]/255.0)*191);

              // calculate ramp up from
              uint8_t heatramp = t192 & 0x3F; // 0..63
              heatramp <<= 2; // scale up to 0..252

              // figure out which third of the spectrum we're in:
              //this is where you can reverse the effect by switching the commented out lines in all 3 places.
              if( t192 > 0x80) {                     // hottest
                //it[it.size() - Pixel - 1] = Color(255, 255, heatramp);
                it[Pixel] = Color(255, 255, heatramp);
              } else if( t192 > 0x40 ) {             // middle
                //it[it.size() - Pixel - 1] = Color(255, heatramp, 0);
                it[Pixel] = Color(255, heatramp, 0);
              } else {                               // coolest
                //it[it.size() - Pixel - 1] = Color(heatramp, 0, 0);
                it[Pixel] = Color(heatramp, 0, 0);
              }
            }
      - addressable_lambda:
          name: "Expo Light"
          update_interval: 16ms
          lambda: |-
            static int x = -400;
            float y = 0.35+0.65*exp(-pow(x, 2)/49000);
            uint8_t r = ceil(current_color.r * y);
            uint8_t g = ceil(current_color.g * y);
            uint8_t b = ceil(current_color.b * y);
            it.all() = Color(r,g,b);
            x += 1;
            if (x == 400)
              x = -400;
      - addressable_lambda:
          name: "Wipe In"
          update_interval: 12ms
          lambda: |-
            static int x = 0;
            if (initial_run) {
              x = 0;
              it.all() = Color::BLACK;
            }
            if (x < it.size()) {
              it[x] = current_color;
              x += 1;
            }
      - addressable_lambda:
          name: "Wipe Out"
          update_interval: 12ms
          lambda: |-
            static int x = 0;
            if (initial_run) {
              x = it.size();
            }
            if (x > 0) {
              x -= 1;
              it[x] = Color::BLACK;
            }
      # Used by led-air-quality.yaml: air quality colour with the first and last LED blinking yellow
      - addressable_lambda:
          name: "No WiFi Indicator"
          update_interval: 50ms
          lambda: |-
            it.all() = current_color;
            bool blink_on = (millis() / 500) % 2 == 0;
            Color indicator = blink_on ? Color(255, 200, 0) : Color::BLACK;
            it[0] = indicator;
            it[it.size() - 1] = indicator;
      # Used by led-air-quality.yaml: air quality colour plus a white light that
      # points towards every person the LD2450 sees (up to 3) and follows them
      - addressable_lambda:
          name: "Presence Tracker"
          update_interval: 40ms
          lambda: |-
            static float pos[3] = {0, 0, 0};
            static bool active[3] = {false, false, false};
            const float n = it.size();
            sensor::Sensor *angles[3] = {id(ld2450_target1_angle), id(ld2450_target2_angle),
                                         id(ld2450_target3_angle)};
            it.all() = current_color;
            for (int t = 0; t < 3; t++) {
              float angle = angles[t]->state;
              if (!angles[t]->has_state() || isnan(angle)) {
                active[t] = false;
                continue;
              }
              // Angle (degrees, 0 = straight ahead) -> position on the ring (in LEDs)
              float target = ${ledring_front_led} + ${ledring_direction} * angle * n / 360.0f;
              if (!active[t] || initial_run) {
                pos[t] = target;  // New person: jump straight to the position
                active[t] = true;
              } else {
                pos[t] += (target - pos[t]) * 0.15f;  // Glide smoothly
              }
              // Light the two nearest LEDs proportionally, so the light moves fluently
              for (int i = 0; i < it.size(); i++) {
                float dist = fabsf(fmodf(i - pos[t] + 1.5f * n, n) - 0.5f * n);
                if (dist < 1.0f) {
                  Color c = it[i].get();
                  it[i] = c.gradient(Color::WHITE, (uint8_t) ((1.0f - dist) * 255.0f));
                }
              }
            }
      - addressable_random_twinkle:
      - addressable_flicker:
      - addressable_fireworks:
      - addressable_twinkle:
      - addressable_scan:
      - addressable_color_wipe:
      - flicker:
      - strobe:
      - random:
      - pulse: