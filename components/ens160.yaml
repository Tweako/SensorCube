# ENS160 Air Quality sensor with improved calibration and documentation

substitutions:
  # ENS160 configuration
  ens160_address: "0x53"
  ens160_update_interval: "60s"
  
  # AHT20 compensation sensor configuration
  aht20_address: "0x38"
  aht20_temp_offset: "-7"  # Offset due to ENS160 heat dissipation
  aht20_hum_offset: "12"   # Offset due to ENS160 heat dissipation (matched to the DHT22, which agrees with a reference sensor)
  
  # ENS160 calibration
  ens160_eco2_offset: "-100"  # Based on comparison with Sensirion SCD40
  ens160_eco2_window_size: "10"  # Average over the last 10 readings (10 min)
  ens160_eco2_send_every: "5"    # Publish every 5 readings (5 min)
  ens160_eco2_min: "400"         # The ENS160 never reports below 400 ppm; don't go lower after the offset

  # Ventilation advice (initial threshold, adjustable via number entity)
  ventilation_threshold: "1000"  # ppm eCO2
  ventilation_hysteresis: "100"  # Turns off below threshold - hysteresis

sensor:
  - platform: ens160_i2c
    id: ens160_sensor
    address: ${ens160_address}
    update_interval: ${ens160_update_interval}
    aqi:
      name: "Air Quality Index"
      id: ens160_aqi
      icon: "mdi:air-filter"
    eco2:
      name: "eCO2"
      id: ens160_eco2
      icon: "mdi:molecule-co2"
      filters:
        - offset: ${ens160_eco2_offset} # Based on comparison with Sensirion SCD40
        - sliding_window_moving_average: # Smooth out the values
            window_size: ${ens160_eco2_window_size}
            send_every: ${ens160_eco2_send_every}
        - lambda: |-
            // Keep eCO2 at the sensor minimum (400 ppm) after the offset
            if (x < ${ens160_eco2_min}) {
              return ${ens160_eco2_min};
            } else if (x > 65000) {
              // Cap extreme values
              ESP_LOGW("ens160", "eCO2 value very high: %.0f ppm", x);
              return 65000;
            } else {
              return x;
            }
    tvoc:
      name: "TVOC"
      id: ens160_tvoc
      icon: "mdi:chemical-weapon"
      filters:
        - lambda: |-
            // Sanity check for TVOC values
            if (x < 0 || x > 65000) {
              ESP_LOGW("ens160", "TVOC value out of range: %.0f ppb", x);
              return {};
            }
            return x;
    compensation:
      temperature: id_temperature_sensor
      humidity: id_humidity_sensor
      
  # AHT20 sensor for temperature and humidity compensation
  - platform: aht10
    variant: AHT20
    address: ${aht20_address}
    update_interval: ${ens160_update_interval}
    temperature:
      id: id_temperature_sensor
      name: "ENS160+AHT20 Temperature"
      internal: true
      filters:
        - offset: ${aht20_temp_offset} # Offset due to ENS160 heat dissipation
        - lambda: |-
            if (x < -40.0 || x > 80.0) {
              ESP_LOGW("aht20", "Temperature out of range: %.1f°C", x);
              return {};
            }
            return x;
    humidity:
      id: id_humidity_sensor
      name: "ENS160+AHT20 Humidity"
      internal: true
      filters:
        - offset: ${aht20_hum_offset} # Offset due to ENS160 heat dissipation
        - lambda: |-
            if (x < 0.0 || x > 100.0) {
              ESP_LOGW("aht20", "Humidity out of range: %.1f%%", x);
              return {};
            }
            return x;

# Text sensors for readable air quality status and sensor state
text_sensor:
  - platform: template
    name: "Air Quality"
    id: air_quality_description
    icon: "mdi:air-filter"
    lambda: |-
      if (isnan(id(ens160_aqi).state)) {
        return {"Unknown"};
      }
      int aqi = (int)id(ens160_aqi).state;
      
      if (aqi == 1) {
        return {"Excellent"};
      } else if (aqi == 2) {
        return {"Good"};
      } else if (aqi == 3) {
        return {"Fair"};
      } else if (aqi == 4) {
        return {"Poor"};
      } else if (aqi == 5) {
        return {"Unhealthy"};
      } else {
        return {"Unknown"};
      }
    update_interval: 60s

  - platform: template
    name: "Air Quality Sensor Status"
    id: ens160_status
    icon: "mdi:air-filter"
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      // validity_flag_ is protected; read it through a member pointer of a derived type
      struct Access : ens160_base::ENS160Component {
        static auto flag() { return &Access::validity_flag_; }
      };
      if (id(ens160_sensor)->is_failed()) {
        return {"Error"};
      }
      switch ((int) (id(ens160_sensor)->*Access::flag())) {
        case 0: return {isnan(id(ens160_eco2).state) ? "Starting" : "Normal"};
        case 1: return {"Warming Up"};         // ~3 minutes after every power-on
        case 2: return {"Initial Start-up"};   // ~1 hour after the very first power-on
        case 3: return {"Invalid Output"};
        default: return {"Unknown"};
      }

# Ventilation advice for automations (e.g. notification or ventilation fan)
number:
  - platform: template
    name: "Ventilation Threshold"
    id: ventilation_threshold
    icon: "mdi:window-open-variant"
    entity_category: config
    unit_of_measurement: "ppm"
    min_value: 0
    max_value: 5000
    step: 50
    initial_value: ${ventilation_threshold}
    restore_value: true
    optimistic: true

binary_sensor:
  - platform: template
    name: "Ventilation Needed"
    id: ventilation_needed
    icon: "mdi:window-open-variant"
    lambda: |-
      // Hysteresis prevents toggling around the threshold
      static bool needed = false;
      float eco2 = id(ens160_eco2).state;
      if (isnan(eco2)) {
        return {};
      }
      float threshold = id(ventilation_threshold).state;
      if (!needed && eco2 >= threshold) {
        needed = true;
      } else if (needed && eco2 < threshold - ${ventilation_hysteresis}) {
        needed = false;
      }
      return needed;
