# LED Air Quality component
# Drives the LED ring from the eCO2 level (colour) and ambient light (brightness).
# Requires: ens160_eco2 (ens160.yaml), illuminance (ldr.yaml), led_ring (ledring.yaml)
#
# States:
#   eCO2 thresholds    -> blue / green / yellow / orange / red "Pulse" / red "Strobe"
#   no eCO2 value yet  -> "Rainbow Spinner"
#   no WiFi            -> air quality colour with the first and last LED blinking yellow
#                         ("No WiFi Indicator" effect); dim yellow "Pulse" if
#                         there is no eCO2 value either
#
# The ring is only updated when the state or brightness changes, so manual control
# from Home Assistant is kept until the air quality changes. Turn off the
# "LED Air Quality Indicator" switch to disable the automation entirely.

substitutions:
  # Configurable thresholds for eCO2 levels (ppm)
  eco2_excellent: "600"    # Excellent (blue)
  eco2_good: "800"         # Good (green)
  eco2_fair: "1000"        # Fair (yellow)
  eco2_poor: "1500"        # Poor (orange)
  eco2_bad: "65000"        # Very poor (red, pulse); at or above: red strobe

  # LED brightness settings
  brightness_min: "0.05"    # Minimum brightness (5%)
  brightness_max: "0.50"    # Maximum brightness (50%)
  lux_scale_factor: "200.0" # Lux at which brightness_max is (almost) reached
  led_aq_check_interval: "5s"
  led_aq_startup_delay: "10s" # Let the boot animation play first
  led_no_wifi_effect: "No WiFi Indicator" # Effect from ledring.yaml

globals:
  - id: led_aq_last_state
    type: int
    initial_value: "-1"
  - id: led_aq_last_brightness
    type: float
    initial_value: "-1.0"

switch:
  - platform: template
    name: "LED Air Quality Indicator"
    id: led_aq_enabled
    icon: "mdi:led-on"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      # Force a refresh on the next interval run (also runs on restore at boot,
      # so don't update the ring here or it would race the boot animation)
      - lambda: "id(led_aq_last_state) = -1;"
    on_turn_off:
      - lambda: "id(led_aq_last_state) = -2;"  # Off; leave the ring to the user
      - light.turn_off: led_ring

script:
  - id: led_aq_update
    mode: single
    then:
      - lambda: |-
          // First run after boot: always apply, to replace the boot animation
          static bool first_run = true;
          if (first_run) {
            first_run = false;
            id(led_aq_last_state) = -1;
          }

          if (!id(led_aq_enabled).state) {
            // Disabled: switch the ring off once (e.g. after the boot animation),
            // then leave it to the user
            if (id(led_aq_last_state) != -2) {
              id(led_aq_last_state) = -2;
              auto off = id(led_ring).turn_off();
              off.perform();
            }
            return;
          }

          bool online = wifi::global_wifi_component->is_connected();

          // Air quality level: 0 = no eCO2 value (yet), 1..6 = excellent..extremely poor
          int level = 0;
          if (!isnan(id(ens160_eco2).state)) {
            float eco2 = id(ens160_eco2).state;
            if (eco2 < ${eco2_excellent}) level = 1;
            else if (eco2 < ${eco2_good}) level = 2;
            else if (eco2 < ${eco2_fair}) level = 3;
            else if (eco2 < ${eco2_poor}) level = 4;
            else if (eco2 < ${eco2_bad}) level = 5;
            else level = 6;
          }
          int state = level + (online ? 0 : 10);

          // Brightness based on ambient light, limited to [min, max]
          float brightness = ${brightness_min};
          if (!isnan(id(illuminance).state)) {
            brightness = (id(illuminance).state / ${lux_scale_factor}) * ${brightness_max} + ${brightness_min};
            brightness = fmaxf(${brightness_min}, fminf(${brightness_max}, brightness));
          }

          // Only update the LED ring when something actually changed
          if (state == id(led_aq_last_state) &&
              fabsf(brightness - id(led_aq_last_brightness)) < 0.02f) {
            return;
          }
          id(led_aq_last_state) = state;
          id(led_aq_last_brightness) = brightness;

          auto call = id(led_ring).turn_on();
          call.set_brightness(brightness);
          switch (level) {
            case 0:  // No data (yet)
              if (online) {
                call.set_effect("Rainbow Spinner");
              } else {
                // Nothing to show: dim yellow pulse = not connected
                call.set_rgb(1, 1, 0);
                call.set_brightness(${brightness_min});
                call.set_effect("Pulse");
              }
              break;
            case 1: call.set_rgb(0, 0, 1); break;    // Excellent: blue
            case 2: call.set_rgb(0, 1, 0); break;    // Good: green
            case 3: call.set_rgb(1, 1, 0); break;    // Fair: yellow
            case 4: call.set_rgb(1, 0.5, 0); break;  // Poor: orange
            default: call.set_rgb(1, 0, 0); break;   // Very / extremely poor: red
          }
          if (level > 0) {
            if (!online) {
              // Show the air quality colour with the first and last LED blinking yellow
              call.set_effect("${led_no_wifi_effect}");
            } else if (level == 5) {
              call.set_effect("Pulse");
            } else if (level == 6) {
              call.set_effect("Strobe");
            } else {
              call.set_effect("None");
            }
          }
          call.perform();

interval:
  - interval: ${led_aq_check_interval}
    startup_delay: ${led_aq_startup_delay}
    then:
      - script.execute: led_aq_update
