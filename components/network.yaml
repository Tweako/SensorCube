# Network: WiFi (with fallback AP + captive portal), Home Assistant API, OTA, web server and time

wifi:
  # Fallback access point using the device name, for provisioning WiFi credentials
  ap:

# In combination with the `ap` this allows the user
# to provision wifi credentials to the device.
captive_portal:

# Enable Home Assistant API
api:

# HTTP Request component required for OTA updates via manifest
http_request:
  # GitHub release downloads redirect to a very long signed URL (~1.5 kB);
  # the default 512 byte TX buffer fails with "HTTP_CLIENT: Out of buffer"
  buffer_size_tx: 2048

ota:
  - platform: esphome
    password: ""
  - platform: http_request

web_server:
  port: 80
  version: 3
  # eCO2 chart and radar map below the page (one js_include only, so all widgets are in this file)
  js_include: "web/sensorcube.js"  # Relative to this file, so it also works as a remote package

time:
  # Time from Home Assistant, with SNTP as fallback when no HA client is connected.
  # Both set the system clock; the first sync fills in "Online since".
  - platform: homeassistant
    id: time_homeassistant
    on_time_sync:
      - component.update: uptime_timestamp
  - platform: sntp
    id: time_sntp
    on_time_sync:
      - component.update: uptime_timestamp

sensor:
  # Timestamp of the last boot, calculated once after the first time sync
  - platform: template
    name: "Online since"
    id: uptime_timestamp
    device_class: timestamp
    accuracy_decimals: 0
    update_interval: never
    icon: "mdi:clock-start"
    entity_category: diagnostic
    lambda: |-
      if (id(uptime_timestamp).has_state()) {
        return {};  // Boot time doesn't change; keep the first value
      }
      auto now = id(time_sntp).utcnow();  // System clock, set by either time source
      if (!now.is_valid()) {
        return {};
      }
      return (float) (now.timestamp - (time_t) (millis() / 1000));
